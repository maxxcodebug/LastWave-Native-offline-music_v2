name: Offline Player Release Build

on:
  push:
    branches: [offline-player, main]
  workflow_dispatch:

concurrency:
  group: offline-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.daemon=false
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --update
          sdkmanager --list
          sdkmanager --install "platforms;android-37" "cmake;3.22.1"

      - name: Validate signing secrets
        shell: bash
        run: |
          if [[ -z "$SIGNING_KEY" || \
                -z "$RELEASE_STORE_PASSWORD" || \
                -z "$RELEASE_KEY_PASSWORD" || \
                -z "$RELEASE_KEY_ALIAS" ]]; then
            echo "::error::One or more signing secrets are missing."
            exit 1
          fi
          echo "Signing secrets are configured."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APKs
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:assembleRawRelease \
            --stacktrace --no-daemon 2>&1 | tee build_output.txt

      - name: Verify APK signatures
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk \
                app/build/outputs/apk/rawRelease/*.apk)

          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "::error::No release APKs were generated."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-signed-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/rawRelease/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-build-log
          path: build_output.txt
          if-no-files-found: ignore
          retention-days: 7
